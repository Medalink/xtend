<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pomo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <nav class="tabs">
      <button data-preset="focus" aria-keyshortcuts="1">Deep work</button>
      <button data-preset="short" aria-keyshortcuts="2">Recharge</button>
      <button data-preset="long" aria-keyshortcuts="3">Long recharge</button>
    </nav>
    <div class="dial">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="46" />
        <circle id="ring" class="ring-progress" cx="50" cy="50" r="46" pathLength="1" />
      </svg>
      <div id="time" class="time" role="timer">50:00</div>
    </div>
    <div class="controls">
      <button id="start" class="primary" aria-keyshortcuts="Space">Start</button>
      <button id="reset" aria-keyshortcuts="R">Reset</button>
    </div>
    <footer class="progress">
      <div id="sessions" class="sessions"></div>
      <div id="count" class="count"></div>
    </footer>
  </main>
  <script src="timer.js"></script>
  <script src="ui.js"></script>
</body>
</html>
